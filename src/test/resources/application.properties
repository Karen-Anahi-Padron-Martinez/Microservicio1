spring.application.name=Ejercicio5MyAPIGestor
# Configuración de base de datos H2 en memoria para pruebas automáticas en Jenkins/CI
spring.datasource.url=jdbc:h2:mem:dbgestortest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.cors.allowed-origins=http://localhost:8082

# Observabilidad (Actuator): health para Docker/monitoreo y métricas en formato Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Histograma de latencias HTTP: permite calcular p95/p99 en Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
