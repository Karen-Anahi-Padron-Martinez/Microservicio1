spring.application.name=Ejercicio5MyAPIGestor
server.port=8081

# Conexión a MariaDB: credenciales por variables de entorno (DB_URL, DB_USER, DB_PASSWORD), nunca en el repositorio
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/dbgestor?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Forzar codificación UTF-8 en peticiones y respuestas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=${SHOW_SQL:false}
# En contenedores el esquema lo crea Microservicio-BD (DDL_AUTO=none); en local se mantiene update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# Orígenes permitidos para CORS (el Cliente web corre en el puerto 8082)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082}

# Observabilidad (Actuator): health para Docker/monitoreo y métricas en formato Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Histograma de latencias HTTP: permite calcular p95/p99 en Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
