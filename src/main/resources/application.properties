spring.application.name=Ejercicio5MyAPIGestor
server.port=8081

# Codificación y Conexión a MariaDB / MySQL en UTF-8
spring.datasource.url=jdbc:mariadb://localhost:3307/dbgestor?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=linux
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Forzar codificación UTF-8 en peticiones y respuestas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Configuración JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.charSet=UTF-8